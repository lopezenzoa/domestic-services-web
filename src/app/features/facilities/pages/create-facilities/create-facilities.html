<div class="container">
  <div class="card">
    
    <h1 class="title">Agregar Nuevo Servicio</h1>
    <p class="subtitle">Ingresa los detalles del nuevo servicio disponible</p>

    <form [formGroup]="form" (ngSubmit)="submit()" class="form">

      <div class="form-group">
        <label for="name">Nombre del Servicio</label>
        <input id="name" formControlName="name" type="text" placeholder="Ej: Plomería">
      </div>

      <div class="form-group">
        <label for="description">Descripción</label>
        <input id="description" formControlName="description" type="text" placeholder="Ej: Arreglo de caños, electricidad...">
      </div>

      <div class="buttons">
        <button type="submit" class="btn-primary" [disabled]="loading()">
          Guardar Servicio
        </button>
        <button type="button" class="btn-secondary" routerLink="/facilities">
          Cancelar
        </button>
      </div>

      <p class="msg success" *ngIf="success()">{{ success() }}</p>
      <p class="msg error" *ngIf="error()">{{ error() }}</p>

    </form>
  </div>
</div>
