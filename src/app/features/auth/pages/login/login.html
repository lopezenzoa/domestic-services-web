<div class="login-wrapper">

   <div class="login-left">
  <!-- Contenedor del logo -->
  <div class="logo-container">
    <img src="../../../../../assets/logo (1).png" alt="ServiFácil logo" class="logo" />
  </div>

  <!-- Contenedor del texto (separado del logo) -->

</div>

      <form>
