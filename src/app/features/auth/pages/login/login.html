<div class="login-wrapper">
  <div class="login-card">
    <!-- LADO IZQUIERDO -->
    <div class="login-left">
      <!-- Contenedor del logo -->
      <div class="logo-container">
        <img src="../../../../../assets/logo3.png" alt="ServiFácil logo" class="logo" />
      </div>

      <!-- Contenedor del texto (separado del logo) -->
      <div class="text-content">
        <h2>ServiFácil: Tu Hogar, Solucionado</h2>
        <p>Conectando a los mejores profesionales con tu hogar</p>
      </div>
    </div>

    <!-- LADO DERECHO -->
    <div class="login-right">
      <h2>¡Bienvenido/a a ServiFácil!</h2>
      <p>¿Aún no tienes cuenta? <a routerLink="/auth/register">Regístrate aquí</a></p>

      <form [formGroup]="form" (ngSubmit)="login()">
        <label for="username">Usuario</label>
        <input
          type="text"
          id="username"
          placeholder="Introduce tu nombre de usuario"
          formControlName="username"
        />

        <label for="password">Contraseña</label>
        <input
          type="password"
          id="password"
          placeholder="Ingresa tu contraseña"
          formControlName="password"
        />

        <button type="submit" class="login-btn" [disabled]="!form.valid">Iniciar Sesión</button>

        <div *ngIf="errorMessage" class="error-text">
          {{ errorMessage }}
        </div>
      </form>
    </div>
  </div>
</div>
