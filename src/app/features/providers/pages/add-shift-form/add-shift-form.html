<div class="shift-wrapper">
    <div class="form-card">
        <h2>{{ title() }}</h2>

        <form [formGroup]="form" (ngSubmit)="submit()">

            <mat-form-field appearance="outline">
                <mat-label>Seleccionar fecha</mat-label>

                <input matInput [matDatepicker]="picker" formControlName="date" [min]="today">
                <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
                <mat-datepicker #picker></mat-datepicker>
            </mat-form-field>

            <div class="time-field">
                <label>Hora de inicio</label>
                <input type="time" formControlName="startTime">
            </div>


            <button type="submit">
            {{ shiftId() ? 'Actualizar' : 'Agregar' }} turno
          </button>

            <p *ngIf="success()" class="success">

                Turno agregado correctamente:<br> {{ form.get("date")?.value | date: 'fullDate' }} - {{ form.get("startTime")?.value }}
            </p>

        </form>
    </div>
</div>
