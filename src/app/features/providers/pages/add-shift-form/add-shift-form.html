<div class="shift-wrapper">
  <div class="form-card">
    <h2>Agregar nuevo turno</h2>

    <mat-form-field appearance="outline">
      <mat-label>Seleccionar fecha</mat-label>
      <input matInput [matDatepicker]="picker" [(ngModel)]="selectedDate" name="date">
      <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
      <mat-datepicker #picker></mat-datepicker>
    </mat-form-field>

    <div class="time-field">
      <label>Hora de inicio</label>
      <input type="time" [(ngModel)]="startTime" name="startTime">
    </div>

    <div class="time-field">
      <label>Hora de fin</label>
      <input type="time" [(ngModel)]="endTime" name="endTime">
    </div>

    <button (click)="agregarTurno()">Agregar turno</button>

    <p *ngIf="success" class="success">
      Turno agregado correctamente:<br>
      {{ selectedDate | date: 'fullDate' }} - {{ startTime }} a {{ endTime }}
    </p>
  </div>
</div>
